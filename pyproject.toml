[project]
name = "power-defect-analysis-mcp"
version = "0.1.0"
description = "基于KKS的火电缺陷智能分析只读MCP工具"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "jsonschema>=4.26,<5",
  "sqlglot>=27,<28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
