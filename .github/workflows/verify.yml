name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize locked environment
        run: uv sync --extra test --frozen
      - name: Verify lock and generated contracts
        run: |
          uv lock --check
          uv run python scripts/compile_semantics.py --check
      - name: Compile and test
        run: |
          uv run python -m py_compile app.py runtime/*.py
          uv run pytest -q tests
